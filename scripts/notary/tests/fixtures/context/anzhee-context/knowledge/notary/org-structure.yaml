# knowledge/notary/org-structure.yaml — ростер ролей серий Anzhee (бот-нотариус).
#
# ⚠️ Артефакт фазы Ф5 (ЗАВ1). АВТОРСКИЙ контент, подготовлен ЛОКАЛЬНО (контракт §3.4:
# боевое размещение в anzhee-context — владелец/Ф8). Служит И тест-фикстурой, И
# заготовкой для команды.
#
# Контракт Ф4 §1.4: rosters[slug].roles[*] 1-в-1 с series_roster.RosterEntry
# (name/domain/keywords). Источник: тело `_STATIC_ROSTERS` (хардкод Ф3) перенесено
# СЮДА без изменений (домены и написания сверены с владельцем — источник правды
# plans/2026-06-09-coordination-protocol-corrections.md §5):
#   поставки→Мария Михина, коммерция→Сона Енгибарян, сервис→Михаил Саргин,
#   резервы→Дарья Набережная, финансы→Ольга Новикова.
#
# Опасная тройка: keywords — доменная лексика, не ПДн; имена и так в составе встреч.
version: 1
rosters:
  # ключ — slug серии (папка в me/встречи, watched.yaml, series-display.json)
  series-ezhenedelnaya-koordinaciya-8399ea:
    company: anzhee
    roles:
      - name: "Мария Михина"
        domain: "поставки"
        keywords: ["поставк", "контейнер", "ктк", "отгруз", "таможн", "досмотр",
                   "декларац", "склад агент", "перевозчик", "логист", "закуп", "груз"]
      - name: "Сона Енгибарян"
        domain: "коммерция"
        keywords: ["продаж", "выручк", "оффер", "акб", "лид", "клиент", "тендер",
                   "контракт", "коммерч", "воронк", "регистрац", "сделк", "оборот"]
      - name: "Михаил Саргин"
        domain: "сервис"
        keywords: ["сервис", "обслуживан", "ремонт", "гаранти", "ателье", "рекламац",
                   "монтаж", "установк", "поддержк", "техник"]
      - name: "Дарья Набережная"
        domain: "резервы"
        keywords: ["резерв", "остатк", "оборачиваемост", "запас", "неликвид",
                   "срез по резерв", "товарный запас"]
      - name: "Ольга Новикова"
        domain: "финансы"
        keywords: ["финанс", "платёж", "платеж", "оплат", "юан", "кредит", "ндфл",
                   "ндс", "ковенант", "бюджет", "тенге", "касс", "задолженност"]

# Справочник людей компании (R18, план 2026-06-16). Company-level: статус участия
# (active|inactive), канон имени, алиасы. Бот не подставляет автором неактивного
# (status=inactive выпадает из name_pool/ожидаемых; R4/R5). Запись БЕЗ поля status
# = активный участник (бэкомпат со старой схемой — см. «Илья Рыбалка»).
#
# ⚠️ Смысл status=inactive: человек УШЁЛ из компании / вообще не бывает на встречах
# серии (постоянное отсутствие). РАЗОВОЕ отсутствие активного человека на КОНКРЕТНОЙ
# встрече — это НЕ inactive, а слой R9 (negative-roster ТЕКУЩЕЙ встречи). Не помечай
# inactive того, кто просто пропустил одну встречу или чьё имя на встрече исказили.
people:
  - name: "Мария Михина"
    status: active
    aliases: ["Мария"]
  - name: "Сона Енгибарян"
    status: active
    aliases: ["Сона"]
  - name: "Михаил Саргин"
    status: active
    aliases: ["Михаил С."]
  - name: "Дарья Набережная"
    status: active
    aliases: ["Дарья"]
  - name: "Ольга Новикова"
    status: active
    aliases: ["Ольга"]
  # Старая запись без status — трактуется как активный участник (бэкомпат R18).
  - name: "Илья Рыбалка"
    aliases: ["Илья"]

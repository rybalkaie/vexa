# knowledge/notary/org-structure.yaml — ростер ролей серий МПервый (бот-нотариус).
#
# ⚠️ Артефакт фазы Ф5 (ЗАВ1). СТАБ: реальный состав координации МПервый появится
# вместе с данными МПервый (НЕ выдумываем роли — правило репо «не придумывай факты»).
# Пустой/отсутствующий ростер серии → у бота fallback S1+S2+LLM (поведение как до Ф3),
# это штатно. Как только здесь появится rosters[<slug>].roles — МПервый-координация
# получит доменный маппинг автоматически (тело series_roster.get_roster читает отсюда).
#
# Контракт Ф4 §1.4: rosters[slug].roles[*] 1-в-1 с series_roster.RosterEntry.
version: 1
rosters: {}

# Справочник людей компании (R18, план 2026-06-16). СТАБ: реальный состав
# МПервый-координации появится вместе с данными (НЕ выдумываем). Пустой список →
# парсер отдаёт [] (graceful), бот не сужает name_pool по неактивным (поведение
# как до R18). Как только появятся записи {name, status, aliases} — подхватятся.
people: []

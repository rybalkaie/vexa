# Потолок памяти для СОСЕДНИХ юнитов Ватсона (drop-in, Ф9).
#
# Зачем: сегодня лимита нет ни у одного из 14 юнитов, а transcription-service
# круглосуточно держит ~1,9 ГБ. Под давлением памяти OOM-killer выбирает «самого
# жирного» — то есть самого Ватсона. Защитить соседей ОТ шлюза (потолок в его
# юните) — половина дела; вторая половина здесь.
#
# Как ставить (на каждый юнит своё значение, значения ниже — стартовые):
#   sudo mkdir -p /etc/systemd/system/<unit>.service.d
#   sudo cp 10-memory-limits.conf /etc/systemd/system/<unit>.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart <unit>
#
# 🔴 ВАЖНО: MemoryMax = жёсткий OOM для юнита. Ставить ТОЛЬКО после замера
# фактического пика (`systemctl status <unit>` → Memory, либо
# `systemd-cgtop -m`), иначе потолок сам начнёт убивать рабочую службу.
# Порядок: сперва MemoryHigh (мягкое давление, служба живёт), неделю смотреть,
# потом MemoryMax. Значения ниже — ШАБЛОН, а не готовая истина.
#
# Ориентиры (проверить замером перед установкой):
#   meeting-notary-transcription   MemoryHigh=2G   MemoryMax=2560M
#   meeting-notary-listener        MemoryHigh=512M MemoryMax=768M
#   meeting-notary-runner          MemoryHigh=512M MemoryMax=768M
#   meeting-notary-collector       MemoryHigh=512M MemoryMax=768M
#   остальные oneshot-таймеры      MemoryHigh=256M MemoryMax=384M

[Service]
MemoryHigh=512M
MemoryMax=768M
